name: Documenter

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - uses: julia-actions/cache@v3

      # Node.js is provided by DocumenterVitepress via NodeJS_jll — no setup-node step needed.
      # Explicit steps instead of julia-actions/julia-docdeploy, for two reasons:
      # (1) docs/Manifest.toml is committed with NoLimits as a path source, so a plain
      #     instantiate reproduces the env exactly (docdeploy's develop would re-resolve);
      # (2) the build runs at -O0 — the docs are compile-bound like the test suite (the
      #     one live @example page fits tiny fixtures), and -O0 cuts the makedocs phase.
      # Deploys via GITHUB_TOKEN (contents: write). Do NOT set DOCUMENTER_KEY unless an
      # SSH deploy key secret of that name actually exists — an empty value forces
      # Documenter onto the SSH path and breaks the deploy.
      - name: Instantiate docs environment
        run: julia --project=docs --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs --color=yes -O0 --min-optlevel=0 docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting gate: Runic (pinned major). Runic has no configuration, so there
  # is no style file and no v1-vs-v2 drift to guard against.
  format-check:
    name: format check (Runic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Install Runic
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="Runic", version="1"))'
      - name: Check formatting
        run: |
          julia -e 'using Runic; exit(Runic.main(ARGS))' -- \
            --check --diff src test docs ext \
            || { echo "::error::Source is not formatted. Run locally: julia -e 'using Runic; Runic.main(ARGS)' -- --inplace src test docs ext"; exit 1; }

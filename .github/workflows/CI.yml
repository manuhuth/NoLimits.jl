name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pkgimages embed native code for the machine that precompiled them, and the
# runner fleet mixes CPU generations - without a pinned multi-target, a depot
# cache saved on one VM is ~fully invalid on the next (observed: 785 of 827
# deps recompiled, 16 min, on a freshly restored cache). This is the official
# Julia x86_64 binary target string, so cached pkgimages load on any runner.
env:
  JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)"

jobs:
  # One job per fixture-affine group in test/runtests.jl (NL_TEST_GROUP=i). The
  # groups used to run as sequential subprocess batches inside a single job,
  # which made the gate ~2.5h and, with branch protection's `strict`, forced
  # every queued PR to re-run against a moved base.
  # Each matrix entry packs TWO fixture-affine groups; the runner executes them
  # as concurrent batch subprocesses (NL_BATCH_PARALLEL, 4 vCPUs, ~1 core per
  # batch), so a job's wall time is max(group), not the sum. Pairs put a heavy
  # group with a light one; sized from measured per-file times so no group
  # exceeds ~7 min of content. 12 jobs + 2 threaded stays under the 20-runner
  # concurrency cap with room for Format/Documenter.
  shard:
    name: test shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    # Slowest shard on a green run is ~15 min; GitHub's 360-minute default let a
    # hung shard burn 6 h and block the PR before reporting anything.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Group 27 (Aqua persistent-tasks) is deliberately NOT here: the check
        # measures 10m40 alone (its wrapper env fresh-resolves and precompiles
        # regardless of every cache), which would set the whole gate's wall
        # clock. It still runs at full strength on every push to main via
        # Coverage.yml (group "26,27"), in full local runs, and on marvin.
        group: ["8,25", "17,21", "18,26", "2,24", "19", "22", "13,14",
                "6,11", "7,23", "5,16", "4,20", "9,10", "3,12", "1,15"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      # Shard depots are identical, so all shards share ONE cache family:
      # per-matrix keys would hold 7 near-identical multi-GB caches against
      # the repo's 10GB limit and evict each other. The save key includes the
      # run id, so within a run the first finished shard saves and the rest
      # no-op; delete-old-caches prunes prior runs.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-test
          include-matrix: "false"
      - uses: julia-actions/julia-buildpkg@v1
      # --check-bounds=auto reuses buildpkg's cached precompile instead of
      # forcing Pkg.test's default --check-bounds=yes full recompile.
      - name: Run tests
        env:
          NL_TEST_GROUP: ${{ matrix.group }}
          NL_BATCH_PARALLEL: "true"
          # Two lanes x default-4 BLAS threads oversubscribes the 4 vCPUs
          # (measured ~20-30% inflation on fit-heavy lanes); 2 each fits.
          OPENBLAS_NUM_THREADS: "2"
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=auto"])'

  # The serial-vs-EnsembleThreads() invariance oracles only mean something with
  # more than one thread, and the rest of CI runs single-threaded to keep the
  # runtime budget, not to hide a defect: the residual threaded-Laplace
  # non-determinism is issue #194, closed won't-fix at ~7e-10 relative on the
  # objective (nonlinear-in-eta models, ~3% of threaded fits). Its magnitude is
  # pinned by the Laplace rtol=1e-6 oracle in estimation_common_tests.jl. So
  # exactly the two files carrying those oracles run threaded here. This is the
  # guard that would have caught #151 (GHQ objective differing by 0.62-0.74
  # relative between serial and threaded).
  # The GHQ #151 oracle lives in api_primitives_tests.jl (tight serial==threaded
  # fit comparison), so the full ghquadrature file no longer re-runs here — it
  # was ~7 min of threaded re-execution of tests that don't touch threading.
  threaded:
    name: test threaded (invariance oracles)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-test
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run invariance oracles with 4 threads
        env:
          JULIA_NUM_THREADS: "4"
          NL_TEST_FILES: "estimation_common_tests.jl,api_primitives_tests.jl"
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=auto"])'

  # Compat canary for the 1.10 (LTS) floor (#37): one job, three groups (Aqua
  # compat/deps, estimation API, pooled — the file with 1.10-RNG-sensitive
  # tolerances). The full 1.10 sweep runs on marvin, not here. Own cache
  # family: a 1.10 depot shares nothing with the 1.12 shards. The pinned
  # test/Manifest.toml is 1.12-only and 1.10's Pkg.test sandbox errors on it
  # ("can not merge projects"), so drop it and re-resolve (~2-6 min) —
  # accepted for a single job.
  compat-lts:
    name: test compat (Julia 1.10)
    runs-on: ubuntu-latest
    # Own cache lane, so cold-cache runs reach ~42 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-test-110
      - uses: julia-actions/julia-buildpkg@v1
      - name: Drop 1.12-pinned test manifest
        run: rm test/Manifest.toml
      - name: Run tests
        env:
          NL_TEST_GROUP: "2,9,14"
          NL_BATCH_PARALLEL: "true"
          OPENBLAS_NUM_THREADS: "2"
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=auto"])'

  # Aggregator. Keeps the exact check name branch protection requires, so the
  # shard count can change without touching the protection settings. Fails if
  # any dependency failed, was cancelled, or was skipped - `needs.*.result` must
  # be checked explicitly, since a failed dependency otherwise just skips this
  # job, and a skipped required check reads as "not run" rather than "failed".
  test:
    name: test (Julia 1.12, ubuntu)
    runs-on: ubuntu-latest
    needs: [shard, threaded, compat-lts]
    if: always()
    steps:
      - name: Check results
        run: |
          failed=0
          for r in "shard:${{ needs.shard.result }}" "threaded:${{ needs.threaded.result }}" "compat-lts:${{ needs.compat-lts.result }}"; do
            echo "$r"
            [ "${r#*:}" = "success" ] || failed=1
          done
          [ "$failed" = "0" ] || exit 1
          echo "all shards and the threaded oracles passed"
